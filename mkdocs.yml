site_name: Data Distillery
site_description: Data Distillery - A framework for data distillation toward the Global Knowledge Commons
site_url: https://datadistillery.org/
repo_url: https://github.com/skybristol/gkc
repo_name: skybristol/gkc
docs_dir: docs
site_dir: site

theme:
  name: material
  favicon: img/DataDistilleryFavIcon.png
  logo: img/DataDistilleryIconNight.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  custom_dir: docs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            heading_level: 2

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Data Curation Narratives:
    - Tribal Governments: tribes.md
  - Architecture:
    - Overview: architecture/index.md
    - Meta-Wikibase: architecture/meta-wikibase.md
    - Wikibase Datatypes: architecture/wikibase-datatypes.md
    - Data Distillery Wikibase: architecture/DataDistillery-Wikibase.md
    - Cross-Module Contracts: architecture/module-contracts.md
    - Still Charger: architecture/still_charger.md
    - SpiritSafe Registry: architecture/SpiritSafe.md
    - SpiritSafe Models & API: architecture/spirit_safe_models.md
    - Profile Loading: architecture/profile-loading.md
    - SpiritSafe Testing: architecture/SpiritSafe-testing.md
    - Validation Architecture: architecture/validation-architecture.md
  - GKC Documentation:
    - Home: gkc/index.md
    - Background: gkc/background.md
    - Wikibase Ontology Orientation: gkc/wikibase_ontology_orientation.md
    - Entity Profiles: gkc/profiles.md
    - Mash: gkc/mash.md
    - Entity JSON: gkc/entity-json-schema.md
    - Wizard: gkc/wizard.md
    - Getting Started:
      - Setup and Orientation: gkc/setup.md
      - Authentication: gkc/authentication.md
    - Data Distillery Workflow:
      - Shipping: gkc/shipping.md
    - API Reference:
      - Overview: gkc/api/index.md
      - Authentication: gkc/api/auth.md
      - Mash: gkc/api/mash.md
      - Mash Formatters: gkc/api/mash_formatters.md
      - Wikibase: gkc/api/wikibase.md
      - Still Charger: gkc/api/still_charger.md
      - Fermenter: gkc/api/fermenter.md
      - Bottler: gkc/api/bottler.md
      - Profiles: gkc/api/profiles.md
      - SpiritSafe: gkc/api/spirit_safe.md
      - ShEx: gkc/api/shex.md
      - Shipper: gkc/api/shipper.md
      - SPARQL: gkc/api/sparql.md
    - Command Line Interface:
      - Overview: gkc/cli/index.md
      - Authentication: gkc/cli/auth.md
      - Mash: gkc/cli/mash.md
      - Profiles: gkc/cli/profiles.md
      - Wizard: gkc/cli/wizard.md
      - ShEx: gkc/cli/shex.md
    - Utilities and Tools:
      - Utilities: gkc/utilities.md
    - Development:
      - CI/CD: gkc/CI_CD.md
      - Release Process: gkc/RELEASE.md
