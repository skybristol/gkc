name: Data Distillery Foundation Properties
description: >
  Foundation property definitions for the Data Distillery Wikibase.
  IDs are optional and may be added after initial instance setup.

version: 1.0.0
status: draft

properties:
  - label: instance of
    description: type to which this subject belongs or corresponds
    datatype: wikibase-item

  - label: subclass of
    description: this item is a subclass (subset) of that item
    datatype: wikibase-item

  - label: same as
    description: link to an entity in another knowledge system that is the same as the subject entity
    datatype: url

  - label: Wikidata Entity Schema
    description: link to a Wikidata Entity Schema that at least loosely corresponds to the same type of entity described by a GKC Entity Profile
    datatype: url

  - label: Wikidata Classifier
    description: Wikidata item that is part of a classification scheme used to classify the entities described by a GKC Entity Profile
    datatype: url

  - label: has statement
    description: links a GKC Entity Profile to a GKC Entity Property included as a statement in that profile
    datatype: wikibase-item

  - label: has qualifier
    description: links a GKC Entity Property to another GKC Entity Property used as a qualifier
    datatype: wikibase-item

  - label: has reference property
    description: links a GKC Entity Property to another GKC Entity Property used in references
    datatype: wikibase-item

  - label: statement order
    description: ordinal position used to render statement flow in wizard and review interfaces
    datatype: quantity

  - label: has specification
    description: links a GKC Entity Property to a GKC Property Specification governing validation or coercion behavior
    datatype: wikibase-item

  - label: validation policy
    description: links a GKC Entity Property or profile to a GKC Validation Policy term
    datatype: wikibase-item

  - label: value behavior
    description: links a statement definition to a GKC Statement Behavior term for the main value
    datatype: wikibase-item

  - label: qualifier behavior
    description: links a statement definition to a GKC Statement Behavior term for qualifiers
    datatype: wikibase-item

  - label: reference behavior
    description: links a statement definition to a GKC Statement Behavior term for references
    datatype: wikibase-item

  - label: message key
    description: stable namespaced key used by fermenter to resolve a specific validation message template
    datatype: string

  - label: message severity
    description: links a GKC Validation Message to a GKC Message Severity classifier
    datatype: wikibase-item

  - label: error message text
    description: monolingual text template for error presentation with placeholders resolved by fermenter
    datatype: monolingualtext

  - label: guidance message text
    description: monolingual text template for additional guidance shown to users
    datatype: monolingualtext

  - label: consequences message text
    description: monolingual text template describing implications of missing or invalid data
    datatype: monolingualtext

  - label: suggestion message text
    description: monolingual text template for actionable suggestions in review and correction workflows
    datatype: monolingualtext

  - label: suggestion type
    description: links a message or specification to a GKC Suggestion Type classifier
    datatype: wikibase-item

  - label: query reference
    description: stable reference string for a SPARQL query artifact used in lookup hydration
    datatype: string

  - label: refresh policy
    description: links a SPARQL query or lookup definition to a GKC Refresh Policy term
    datatype: wikibase-item

  - label: fallback item
    description: links to an item that can be used when online lookup hydration is unavailable or stale
    datatype: wikibase-item

  - label: cache artifact URL
    description: URL for a generated cache artifact used by spirit safe and fermenter runtime paths
    datatype: url

  - label: cache generated at
    description: timestamp for cache generation used for freshness and provenance checks
    datatype: time

  - label: source profile path
    description: path of the originating profile artifact used during sync and transformation
    datatype: string

  - label: source repository ref
    description: source repository branch tag or commit reference used for sync provenance
    datatype: string

  - label: last synced revision
    description: revision identifier captured during synchronization between wikibase and spiritsafe
    datatype: string

  - label: transformed artifact type
    description: links an artifact record to a GKC Artifact Type classifier
    datatype: wikibase-item
